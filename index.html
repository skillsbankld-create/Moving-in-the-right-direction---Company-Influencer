<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moving in the Right Direction</title>
<style>
  :root{
    --navy:#080828;
    --bg:#EBF4FF;
    --surface:#FFFFFF;
    --orange:#FFBC3A;
    --up:#4D88E8;
    --across:#40BDA9;
    --down:#F26A44;
    --ink:#10112c;
    --muted:#5a6180;
    --line:#d7e3f5;
    font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    min-height:100%;
  }

  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .topbar{
    background:var(--navy);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }

  .topbar img{ height:26px; display:block; }

  .progress{
    display:flex;
    gap:6px;
  }

  .progress .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
  }

  .progress .dot.filled.up{ background:var(--up); }
  .progress .dot.filled.across{ background:var(--across); }
  .progress .dot.filled.down{ background:var(--down); }

  .topbar-right{
    display:flex;
    align-items:center;
    gap:16px;
  }

  .lang-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:5px 12px;
  }

  .lang-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:rgba(255,255,255,0.5);
    padding:0;
  }

  .lang-btn.active{
    color:#fff;
    font-weight:700;
  }

  .lang-btn:focus-visible{ outline:2px solid var(--orange); outline-offset:2px; }

  .lang-sep{
    color:rgba(255,255,255,0.3);
    font-size:12px;
  }

  main{
    flex:1;
    display:flex;
    align-items:stretch;
    justify-content:center;
  }

  .screen{
    width:100%;
    max-width:720px;
    padding:48px 24px 64px;
    margin:0 auto;
    animation: rise 0.35s ease both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .screen{ animation:none; }
  }

  /* ---------- WELCOME ---------- */
  .welcome-wrap{
    flex:1;
    width:100%;
    background:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 24px;
    animation: rise 0.35s ease both;
  }

  @media (prefers-reduced-motion: reduce){
    .welcome-wrap{ animation:none; }
  }

  .welcome{
    color:#fff;
    text-align:center;
    max-width:560px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .welcome .mark{ margin-bottom:36px; }
  .welcome .mark img{ height:44px; }

  .welcome h1{
    font-size:clamp(28px,5vw,42px);
    line-height:1.15;
    margin:0 0 10px;
    font-weight:700;
    max-width:14ch;
  }

  .welcome .subtitle{
    font-size:18px;
    color:#b9c6f2;
    margin:0 0 28px;
    font-weight:400;
  }

  .welcome p.copy{
    max-width:46ch;
    font-size:17px;
    line-height:1.6;
    color:#dbe4fa;
    margin:0 0 36px;
  }

  .arrows{
    display:flex;
    gap:22px;
    margin-bottom:36px;
  }
  .arrows svg{ width:34px; height:34px; }

  /* ---------- SHARED CONTAINERS ---------- */
  .eyebrow{
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--muted);
    margin:0 0 6px;
    font-weight:600;
  }

  h2.title{
    font-size:26px;
    margin:0 0 18px;
    font-weight:700;
    color:var(--navy);
  }

  .card{
    background:var(--surface);
    border-radius:10px;
    padding:24px 26px;
    border:1px solid var(--line);
  }

  .accent-left{
    border-left:5px solid var(--orange);
  }

  p.body-text{
    font-size:16px;
    line-height:1.65;
    margin:0 0 14px;
    color:var(--ink);
  }
  p.body-text:last-child{ margin-bottom:0; }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    padding:13px 26px;
    border-radius:8px;
    background:var(--navy);
    color:#fff;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .btn:hover{ transform:translateY(-1px); background:#12144a; }
  .btn:focus-visible{ outline:3px solid var(--orange); outline-offset:2px; }

  .btn.ghost{
    background:transparent;
    color:var(--navy);
    border:1.5px solid var(--navy);
  }
  .btn.ghost:hover{ background:rgba(8,8,40,0.06); }

  .btn.invert{
    background:var(--orange);
    color:var(--navy);
  }
  .btn.invert:hover{ background:#ffc85c; }

  .btn-row{
    display:flex;
    justify-content:center;
    margin-top:32px;
  }

  .btn-row.left{ justify-content:flex-start; }

  /* ---------- PICKER ---------- */
  .tiles{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-top:6px;
  }

  @media (max-width:640px){
    .tiles{ grid-template-columns:1fr; }
  }

  .tile{
    background:var(--surface);
    border:2px solid var(--line);
    border-radius:12px;
    padding:26px 18px;
    text-align:center;
    cursor:pointer;
    font-family:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    transition:transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .tile:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(8,8,40,0.08); }
  .tile:focus-visible{ outline:3px solid var(--orange); outline-offset:2px; }

  .tile.up{ border-color:var(--up); }
  .tile.across{ border-color:var(--across); }
  .tile.down{ border-color:var(--down); }

  .tile .icon-wrap{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tile.up .icon-wrap{ background:rgba(77,136,232,0.12); color:var(--up); }
  .tile.across .icon-wrap{ background:rgba(64,189,169,0.12); color:var(--across); }
  .tile.down .icon-wrap{ background:rgba(242,106,68,0.12); color:var(--down); }

  .tile .icon-wrap svg{ width:24px; height:24px; }

  .tile .name{
    font-size:17px;
    font-weight:700;
    color:var(--navy);
  }

  .tile .to-whom{
    font-size:13px;
    color:var(--muted);
  }

  .tile .status{
    font-size:12px;
    font-weight:600;
    padding:3px 10px;
    border-radius:20px;
    background:#eef1fb;
    color:var(--muted);
  }
  .tile.done .status{
    background:#e4f8f2;
    color:#0d8f6f;
  }

  .see-recap{
    display:block;
    margin:30px auto 0;
    background:none;
    border:none;
    color:var(--navy);
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    text-decoration:underline;
    cursor:pointer;
  }

  /* ---------- WORKSPACE ---------- */
  .work-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }

  .back-link{
    background:none;
    border:none;
    color:var(--muted);
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    padding:6px 0;
  }
  .back-link:hover{ color:var(--navy); }

  .direction-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:20px;
    color:#fff;
  }
  .direction-badge svg{ width:14px; height:14px; }
  .direction-badge.up{ background:var(--up); }
  .direction-badge.across{ background:var(--across); }
  .direction-badge.down{ background:var(--down); }

  .section-label{
    font-size:14px;
    font-weight:700;
    color:var(--navy);
    margin:26px 0 8px;
  }
  .section-label:first-of-type{ margin-top:0; }

  .persona-card{
    background:var(--surface);
    border-radius:10px;
    padding:18px 20px;
    border:1px solid var(--line);
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
  }

  .weak-line{
    background:#fff9f2;
    border:1px dashed #e6b98f;
    border-radius:10px;
    padding:16px 20px;
    font-size:16px;
    font-style:italic;
    color:#7a4b2e;
    line-height:1.55;
  }

  .task-note{
    font-size:14px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.5;
  }

  .hint-note{
    font-size:14px;
    color:#0d8f6f;
    margin-top:6px;
    line-height:1.5;
    font-weight:600;
  }

  textarea{
    width:100%;
    min-height:130px;
    border-radius:10px;
    border:1.5px solid var(--line);
    padding:16px 18px;
    font-family:inherit;
    font-size:16px;
    line-height:1.55;
    resize:vertical;
    color:var(--ink);
    background:var(--surface);
  }
  textarea:focus-visible{ outline:3px solid var(--orange); outline-offset:1px; border-color:var(--orange); }

  .save-note{
    font-size:13px;
    color:var(--muted);
    margin-top:8px;
    height:16px;
  }

  /* ---------- RECAP ---------- */
  .recap-card{
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:14px;
    border-left:6px solid var(--line);
    background:var(--surface);
    border:1px solid var(--line);
    border-left-width:6px;
  }
  .recap-card.up{ border-left-color:var(--up); }
  .recap-card.across{ border-left-color:var(--across); }
  .recap-card.down{ border-left-color:var(--down); }

  .recap-card .label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin-bottom:8px;
  }
  .recap-card.up .label{ color:var(--up); }
  .recap-card.across .label{ color:var(--across); }
  .recap-card.down .label{ color:var(--down); }

  .recap-card .text{
    font-size:16px;
    line-height:1.6;
    color:var(--ink);
  }
  .recap-card .text.empty{
    color:var(--muted);
    font-style:italic;
  }

  .hidden{ display:none !important; }

  /* ---------- RTL MIRRORING ---------- */
  body.rtl .accent-left{
    border-left:none;
    border-right:5px solid var(--orange);
  }

  body.rtl .recap-card{
    border-left-width:1px;
    border-left-color:var(--line);
    border-right-width:6px;
    border-right-color:var(--line);
  }
  body.rtl .recap-card.up{ border-right-color:var(--up); border-left-color:var(--line); }
  body.rtl .recap-card.across{ border-right-color:var(--across); border-left-color:var(--line); }
  body.rtl .recap-card.down{ border-right-color:var(--down); border-left-color:var(--line); }
</style>
</head>

(function(){

      welcomeCopy: "\u0645\u062c\u0645\u0648\u0639\u062a\u0643\u0645 \u0647\u062a\u0634\u062a\u063a\u0644 \u0639\u0644\u0649 \u0645\u0634\u0643\u0644\u0629 \u0648\u0627\u062d\u062f\u0629 \u0648\u0627\u0642\u0639\u064a\u0629 \u0645\u0646 \u0628\u064a\u0626\u0629 \u0627\u0644\u0639\u0645\u0644. \u0627\u062a\u0642\u0633\u0645\u0648\u0627 \u0623\u0632\u0648\u0627\u062c\u060c \u0643\u0644 \u0632\u0648\u062c \u064a\u0627\u062e\u062f \u0627\u062a\u062c\u0627\u0647 \u0645\u062e\u062a\u0644\u0641. \u0643\u0644 \u0632\u0648\u062c \u0647\u064a\u0633\u062a\u0644\u0645 \u0631\u0633\u0627\u0644\u0629 \u0628\u0635\u064a\u063a\u062a\u0647\u0627 \u0627\u0644\u062d\u0627\u0644\u064a\u0629 \u0645\u0634 \u0641\u0639\u0651\u0627\u0644\u0629\u060c \u0648\u0627\u0644\u0645\u0637\u0644\u0648\u0628 \u0625\u0646\u0647 \u064a\u0639\u064a\u062f \u0635\u064a\u0627\u063a\u062a\u0647\u0627 \u0628\u0634\u0643\u0644 \u064a\u062e\u0644\u064a\u0647\u0627 \u062a\u0634\u062a\u063a\u0644.",
      begin: "\u0627\u0628\u062f\u0623\u0648\u0627",
      situationEyebrow: "\u0627\u0644\u0645\u0648\u0642\u0641",
      scenarioTitle: "\u0645\u0634\u0643\u0644\u0629 \u0648\u0627\u062d\u062f\u0629 \u0628\u064a\u0634\u062a\u063a\u0644 \u0639\u0644\u064a\u0647\u0627 \u0627\u0644\u0641\u0631\u064a\u0642 \u0643\u0644\u0647",
      chooseDirection: "\u0627\u062e\u062a\u0627\u0631\u0648\u0627 \u0627\u062a\u062c\u0627\u0647\u0643\u0645",
      yourGroup: "\u0645\u062c\u0645\u0648\u0639\u062a\u0643\u0645",
      written: "\u0645\u0643\u062a\u0648\u0628",
      notStarted: "\u0644\u0633\u0647 \u0645\u0627 \u0628\u062f\u0623\u0646\u0627\u0634",
      seeRecap: "\u0634\u0648\u0641\u0648\u0627 \u0627\u0644\u062a\u062d\u0631\u0643\u0627\u062a \u0627\u0644\u062b\u0644\u0627\u062b\u0629 \u0644\u062d\u062f \u062f\u0644\u0648\u0642\u062a\u064a",
      whoSpeaking: "\u0645\u064a\u0646 \u0627\u0644\u0634\u062e\u0635 \u0627\u0644\u0644\u064a \u0628\u062a\u062a\u0643\u0644\u0645 \u0645\u0639\u0627\u0647\u061f",
      lineWontWork: "\u0627\u0644\u062c\u0645\u0644\u0629 \u0627\u0644\u0644\u064a \u0645\u0634 \u0647\u062a\u062c\u064a\u0628 \u0646\u062a\u064a\u062c\u0629",
      yourFix: "\u0635\u064a\u0627\u063a\u062a\u0643\u0645 \u0627\u0644\u062c\u062f\u064a\u062f\u0629",
      placeholder: "\u0627\u0643\u062a\u0628\u0648\u0627 \u0635\u064a\u0627\u063a\u062a\u0643\u0645 \u0647\u0646\u0627...",
      saved: "\u062a\u0645 \u0627\u0644\u062d\u0641\u0638",
      done: "\u062a\u0645",
      workspaceBack: "\u0627\u0644\u0631\u062c\u0648\u0639 \u0644\u0644\u0627\u062a\u062c\u0627\u0647\u0627\u062a \u2192",
      readyToShare: "\u062c\u0627\u0647\u0632\u064a\u0646 \u0644\u0644\u0645\u0634\u0627\u0631\u0643\u0629",
      yourThreeMoves: "\u062a\u062d\u0631\u0643\u0627\u062a\u0643\u0645 \u0627\u0644\u062b\u0644\u0627\u062b\u0629",
      notWrittenYet: "\u0644\u0633\u0647 \u0645\u0627 \u0627\u062a\u0643\u062a\u0628\u0634.",
      recapBack: "\u0627\u0644\u0631\u062c\u0648\u0639 \u0644\u0644\u0627\u062a\u062c\u0627\u0647\u0627\u062a"
    }
  };

  var lang = "en";

  var ICONS = {
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>',
    across: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>'
  };

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { up:"", across:"", down:"" };
  }

  function saveState(state){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var state = loadState();
  var main = document.getElementById("main");

  function esc(s){
    var d = document.createElement("div");
    d.innerText = s;
    return d.innerHTML;
  }

  function nl2p(text){
    return text.split("\n\n").map(function(para){
      return "<p class=\"body-text\">" + esc(para) + "</p>";
    }).join("");
  }

  function updateDots(){
    document.querySelectorAll("#progressDots .dot").forEach(function(dot){
      var d = dot.getAttribute("data-d");
      dot.classList.toggle("filled", !!state[d] && state[d].trim().length > 0);
      dot.classList.toggle(d, true);
    });
  }

  function render(screen, opts){
    opts = opts || {};
    current = { screen: screen, opts: opts };
    updateDots();
    if(screen === "welcome") return renderWelcome();
    if(screen === "scenario") return renderScenario();
    if(screen === "picker") return renderPicker();
    if(screen === "workspace") return renderWorkspace(opts.direction);
    if(screen === "recap") return renderRecap();
  }

  function setLang(newLang){
    if(newLang !== "en" && newLang !== "ar") return;
    if(newLang === lang) return;
    lang = newLang;
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
    document.body.classList.toggle("rtl", lang === "ar");
    document.title = TEXT[lang].documentTitle;
    document.getElementById("langEnBtn").classList.toggle("active", lang === "en");
    document.getElementById("langArBtn").classList.toggle("active", lang === "ar");
    render(current.screen, current.opts);
  }

  document.getElementById("langEnBtn").addEventListener("click", function(){ setLang("en"); });
  document.getElementById("langArBtn").addEventListener("click", function(){ setLang("ar"); });

  function renderWelcome(){
    var t = TEXT[lang];
    main.innerHTML =
      '<div class="welcome-wrap"><div class="welcome">' +
        '<div class="arrows" style="color:#7d93d8">' + ICONS.up + ICONS.across + ICONS.down + '</div>' +
        '<h1>' + t.welcomeHeadingHTML + '</h1>' +
        '<p class="subtitle">' + esc(t.subtitle) + '</p>' +
        '<p class="copy">' + esc(t.welcomeCopy) + '</p>' +
        '<button class="btn invert" id="beginBtn">' + esc(t.begin) + '</button>' +
      '</div></div>';
    document.getElementById("beginBtn").addEventListener("click", function(){ render("scenario"); });
  }

  function renderScenario(){
    var t = TEXT[lang];
    main.innerHTML =
      '<div class="screen">' +
        '<p class="eyebrow">' + esc(t.situationEyebrow) + '</p>' +
        '<h2 class="title">' + esc(t.scenarioTitle) + '</h2>' +
        '<div class="card accent-left">' + nl2p(SCENARIO[lang]) + '</div>' +
        '<div class="btn-row"><button class="btn" id="toPicker">' + esc(t.chooseDirection) + '</button></div>' +
      '</div>';
    document.getElementById("toPicker").addEventListener("click", function(){ render("picker"); });
  }

  function tileHtml(key){
    var t = TEXT[lang];
    var d = DIRECTIONS[lang][key];
    var done = state[key] && state[key].trim().length > 0;
    return (
      '<button class="tile ' + key + (done ? ' done' : '') + '" data-key="' + key + '">' +
        '<span class="icon-wrap">' + ICONS[key] + '</span>' +
        '<span class="name">' + esc(d.label) + '</span>' +
        '<span class="to-whom">' + esc(d.to) + '</span>' +
        '<span class="status">' + (done ? esc(t.written) : esc(t.notStarted)) + '</span>' +
      '</button>'
    );
  }

  function renderPicker(){
    var t = TEXT[lang];
    main.innerHTML =
      '<div class="screen">' +
        '<p class="eyebrow">' + esc(t.yourGroup) + '</p>' +
        '<h2 class="title">' + esc(t.chooseDirection) + '</h2>' +
        '<div class="tiles">' +
          tileHtml("up") + tileHtml("across") + tileHtml("down") +
        '</div>' +
        '<button class="see-recap" id="seeRecap">' + esc(t.seeRecap) + '</button>' +
      '</div>';

    document.querySelectorAll(".tile").forEach(function(btn){
      btn.addEventListener("click", function(){
        render("workspace", { direction: btn.getAttribute("data-key") });
      });
    });
    document.getElementById("seeRecap").addEventListener("click", function(){ render("recap"); });
  }

  function renderWorkspace(key){
    var t = TEXT[lang];
    var d = DIRECTIONS[lang][key];
    var heading = lang === "ar" ? d.workspaceHeading : ("Fix the message " + d.to);
    main.innerHTML =
      '<div class="screen">' +
        '<div class="work-header">' +
          '<button class="back-link" id="backBtn">' + esc(t.workspaceBack) + '</button>' +
          '<span class="direction-badge ' + key + '">' + ICONS[key] + esc(d.label) + '</span>' +
        '</div>' +
        '<h2 class="title">' + esc(heading) + '</h2>' +

        '<p class="section-label">' + esc(t.situationEyebrow) + '</p>' +
        '<div class="card accent-left">' + nl2p(SCENARIO[lang]) + '</div>' +

        '<p class="section-label">' + esc(t.whoSpeaking) + '</p>' +
        '<div class="persona-card">' + esc(d.persona) + '</div>' +

        '<p class="section-label">' + esc(t.lineWontWork) + '</p>' +
        '<div class="weak-line">' + d.weak + '</div>' +
        '<p class="task-note">' + esc(d.task) + '</p>' +
        '<p class="hint-note">' + esc(d.hint) + '</p>' +

        '<p class="section-label">' + esc(t.yourFix) + '</p>' +
        '<textarea id="fixInput" dir="auto" placeholder="' + esc(t.placeholder) + '">' + esc(state[key] || "") + '</textarea>' +
        '<div class="save-note" id="saveNote"></div>' +

        '<div class="btn-row left"><button class="btn ghost" id="doneBtn">' + esc(t.done) + '</button></div>' +
      '</div>';

    var textarea = document.getElementById("fixInput");
    var saveNote = document.getElementById("saveNote");
    var timeout = null;

    textarea.addEventListener("input", function(){
      state[key] = textarea.value;
      saveState(state);
      updateDots();
      saveNote.textContent = TEXT[lang].saved;
      clearTimeout(timeout);
      timeout = setTimeout(function(){ saveNote.textContent = ""; }, 1200);
    });

    document.getElementById("backBtn").addEventListener("click", function(){ render("picker"); });
    document.getElementById("doneBtn").addEventListener("click", function(){ render("picker"); });
  }

  function recapCard(key){
    var t = TEXT[lang];
    var d = DIRECTIONS[lang][key];
    var text = (state[key] || "").trim();
    return (
      '<div class="recap-card ' + key + '">' +
        '<div class="label">' + esc(d.label) + ' \u2014 ' + esc(d.to) + '</div>' +
        '<div class="text' + (text ? '' : ' empty') + '">' +
          (text ? esc(text) : esc(t.notWrittenYet)) +
        '</div>' +
      '</div>'
    );
  }

  function renderRecap(){
    var t = TEXT[lang];
    main.innerHTML =
      '<div class="screen">' +
        '<p class="eyebrow">' + esc(t.readyToShare) + '</p>' +
        '<h2 class="title">' + esc(t.yourThreeMoves) + '</h2>' +
        recapCard("up") + recapCard("across") + recapCard("down") +
        '<div class="btn-row"><button class="btn ghost" id="backToPicker">' + esc(t.recapBack) + '</button></div>' +
      '</div>';
    document.getElementById("backToPicker").addEventListener("click", function(){ render("picker"); });
  }

  var current = { screen: "welcome", opts: {} };
  render("welcome");
})();
</script>

</body>
</html>
